<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAS Photo Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="viewer" aria-live="polite">
    <img id="photo-a" class="photo active" alt="">
    <img id="photo-b" class="photo" alt="">
    <video id="video" class="video" playsinline></video>
    <section id="collage" class="collage" aria-label="Photo collage"></section>
    <section id="message" class="message-card">
      <h1>NAS Photo Viewer</h1>
      <p id="message-text">Open settings to connect your photo and video library.</p>
      <button id="open-settings-primary">Open settings</button>
    </section>
    <button id="settings-button" class="round-button" aria-label="Settings">⚙</button>
    <div id="caption"></div>
  </main>

  <dialog id="settings-dialog">
    <form id="settings-form">
      <header><h2>Photo and video settings</h2><button type="button" id="close-settings" aria-label="Close">×</button></header>
      <label>Photo location
        <select name="source_type"><option value="smb">NAS / SMB share</option><option value="local">Local folder</option></select>
      </label>
      <div id="smb-fields">
        <label>NAS address<input name="smb_server" placeholder="192.168.20.128"></label>
        <label>Share name<input name="smb_share" placeholder="Photos"></label>
        <label>Username<input name="smb_username" autocomplete="username"></label>
        <label>Password<input name="smb_password" type="password" autocomplete="current-password" placeholder="Leave blank to keep saved password"></label>
      </div>
      <div id="local-fields"><label>Local path<input name="local_path"></label></div>
      <label>Base folder<input name="base_folder" placeholder="Leave blank for the whole share"></label>
      <div class="two-columns">
        <label>Seconds per photo<input name="interval_seconds" type="number" min="3" max="3600"></label>
        <label>Image fit<select name="fit_mode"><option value="contain">Show whole photo</option><option value="cover">Fill the screen</option></select></label>
      </div>
      <div class="two-columns">
        <label>Photo year<input name="date_year" type="number" min="0" max="2200"><small>Use 0 for all years.</small></label>
        <label>Photo month<select name="date_month"><option value="0">All months</option><option value="1">January</option><option value="2">February</option><option value="3">March</option><option value="4">April</option><option value="5">May</option><option value="6">June</option><option value="7">July</option><option value="8">August</option><option value="9">September</option><option value="10">October</option><option value="11">November</option><option value="12">December</option></select></label>
      </div>
      <label>Fade duration<input name="transition_seconds" type="number" min="0" max="10" step="0.25"></label>
      <label>Home Assistant dashboard URL<input name="dashboard_url" type="url" placeholder="http://homeassistant:8123/dashboard/home?kiosk"></label>
      <label>Return to photos after (minutes)<input name="dashboard_return_minutes" type="number" min="0" max="1440"><small>Use 0 to stay on the dashboard.</small></label>
      <label>Sleep after (minutes)<input name="sleep_minutes" type="number" min="0" max="1440"><small>Defaults to 120 minutes. Use 0 to disable automatic sleep.</small></label>
      <p id="form-status"></p>
      <footer><button type="button" id="test-button" class="secondary">Save and test</button><button type="submit">Save settings</button></footer>
    </form>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
