[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nas-photo-viewer"
version = "0.4.0"
description = "A Raspberry Pi HDMI slideshow controlled from a simple web interface"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "paho-mqtt>=2.1,<3",
  "smbprotocol>=1.15,<2",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photo_viewer = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
